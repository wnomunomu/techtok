# Local database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Local OpenAI configuration
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL}

# Local Qiita configuration
app.qiita.access-token=${APP_QIITA_ACCESS_TOKEN}

# Local CORS configuration
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}

# Local scheduler configuration
app.fetch-interval-days=${APP_FETCH_INTERVAL_DAYS}
app.article-cleanup-interval-days=${APP_ARTICLE_CLEANUP_INTERVAL_DAYS}
app.article-retention-days=${APP_ARTICLE_RETENTION_DAYS}
app.summary-source-word-limit=${APP_SUMMARY_SOURCE_WORD_LIMIT}

# Local random refresh configuration
app.random-refresh-cron=${APP_RANDOM_REFRESH_CRON}
app.random-refresh-limit=${APP_RANDOM_REFRESH_LIMIT}
