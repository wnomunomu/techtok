services:
  app:
    image: mcr.microsoft.com/devcontainers/java:3-21-bookworm
    container_name: techtok-app
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydatabase
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_PROFILES_ACTIVE=local
      - APP_CORS_ALLOWED_ORIGIN=http://localhost:5173
      - APP_FETCH_INTERVAL_DAYS=7
      - APP_ARTICLE_CLEANUP_INTERVAL_DAYS=7
      - APP_ARTICLE_RETENTION_DAYS=30
      - APP_SUMMARY_SOURCE_WORD_LIMIT=100
      - APP_RANDOM_REFRESH_CRON=0 0 3 * * *
      - APP_RANDOM_REFRESH_LIMIT=300
      - OPENAI_MODEL=gpt-6-luna
      - NODE_ENV=development
    ports:
      - "5173:5173"
      - "8080:8080"
    command: sleep infinity
    networks:
      - spring-network

  postgres:
    image: postgres:18
    container_name: spring-postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      timeout: 20s
      retries: 10
    networks:
      - spring-network

volumes:
  postgres_data:

networks:
  spring-network:
    driver: bridge
